# Production stack. Needs the external `proxy` network created by the network stack (Traefik).
# Login is OIDC (Authelia), so the router has NO authelia@docker middleware: the app handles
# sessions itself and forward-auth would add Authelia's 5 min inactivity timeout to the PWA.
services:
  app:
    image: forgejo.home.potato/ciccio/potato-mana:${TAG:-latest}
    build: .
    container_name: potato-mana
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    # resolve auth.home.potato for OIDC discovery
    dns: [192.168.1.19, 8.8.8.8]
    environment:
      COOKIE_SECURE: "true"
      PUBLIC_URL: ${PUBLIC_URL:-https://mana-potato.home.potato}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      ADMIN_GROUP: ${ADMIN_GROUP:-admins}
      NODE_EXTRA_CA_CERTS: /certs/potato.crt
      INGEST_CRON: ${INGEST_CRON:-0 4 * * *}
      BACKUP_CRON: ${BACKUP_CRON:-30 2 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
    volumes:
      - ./data:/data
      - ${CA_CERT_FILE:-/opt/services/network/traefik/certs/potato.crt}:/certs/potato.crt:ro
    networks: [proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.potato-mana.rule: Host(`${APP_HOST:-mana-potato.home.potato}`)
      traefik.http.routers.potato-mana.entrypoints: websecure
      traefik.http.routers.potato-mana.tls: "true"
      traefik.http.services.potato-mana.loadbalancer.server.port: "3000"

networks:
  proxy:
    external: true
